name: tests

on:
  workflow_dispatch:
  pull_request:
  # push:
  #   branches: [main]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor: the cluster's ml flow runs match the MLflow serving image's Python
        python-version: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-extras --all-groups --frozen
      - name: unit tests
        run: |
          set -o pipefail && \
          uv run pytest --cov=src/pgiscluster --cov-report=term-missing:skip-covered --junitxml=pytest.xml \
          | tee pytest-coverage.txt
      - name: Pytest coverage comment
        if: matrix.python-version == '3.14'
        uses: MishaKav/pytest-coverage-comment@main
        continue-on-error: true
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
